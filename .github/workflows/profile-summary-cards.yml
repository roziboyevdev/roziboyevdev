name: Verify GitHub Profile Metrics

on:
  push:
    paths:
      - "README.md"
      - "profile-summary-card-output/**"
      - ".github/workflows/profile-summary-cards.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local metric cards
        run: |
          test -f profile-summary-card-output/github_dark/0-profile-details.svg
          test -f profile-summary-card-output/github_dark/1-repos-per-language.svg
          test -f profile-summary-card-output/github_dark/3-stats.svg
          echo "All GitHub profile metric cards are available."
